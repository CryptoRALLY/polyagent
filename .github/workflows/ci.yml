name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax check)
        run: bash -n agent
      - name: shellcheck
        run: shellcheck -S warning agent

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run smoke tests
        run: bash test/smoke.sh
